name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mobile-map-coordinate-overview-4dmszb
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishing to a gh-pages branch auto-enables GitHub Pages on public
      # repos, so no manual settings step is needed.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
