<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Homicide Map</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>HOMICIDE&nbsp;MAP</h1>
    <span class="topbar-count" id="case-count"></span>
  </header>

  <div id="map"></div>

  <!-- In-page bottom sheet: opens when a marker is tapped, scrolls, never a new window -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab" id="sheet-grab">
      <div class="sheet-handle"></div>
    </div>
    <button class="sheet-close" id="sheet-close" aria-label="Close">&times;</button>
    <div class="sheet-content" id="sheet-content">
      <p class="sheet-kicker" id="sheet-kicker"></p>
      <h2 id="sheet-title"></h2>
      <dl class="sheet-facts" id="sheet-facts"></dl>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data/cases.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
